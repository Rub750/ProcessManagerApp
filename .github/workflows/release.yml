name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, single file)
        id: publish
        shell: pwsh
        run: |
          dotnet publish ProcessManagerApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=false -o publish 2>&1 | Tee-Object -FilePath publish_log.txt
          exit $LASTEXITCODE

      - name: Zip
        run: Compress-Archive -Path publish\* -DestinationPath ProcessManagerApp-win-x64.zip

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ProcessManagerApp (Windows x64 - autonome)
          body: |
            Version autonome : aucun prerequis .NET a installer.
            Telecharger le zip, extraire, executer ProcessManagerApp.exe.
          files: ProcessManagerApp-win-x64.zip

      - name: Report failure log as issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = ""
          if (Test-Path publish_log.txt) { $log = (Get-Content publish_log.txt -Tail 120) -join "`n" }
          $body = "Echec du build CI (commit $env:GITHUB_SHA).`n`n" + '```' + "`n" + $log + "`n" + '```'
          gh issue create -R "$env:GITHUB_REPOSITORY" -t "CI build failed - log" -b "$body"
