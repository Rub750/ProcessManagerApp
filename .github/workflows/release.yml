name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, single file)
        run: dotnet publish ProcessManagerApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=false -o publish

      - name: Zip
        run: Compress-Archive -Path publish\* -DestinationPath ProcessManagerApp-win-x64.zip

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ProcessManagerApp (Windows x64 - autonome)
          body: |
            Version autonome : aucun prerequis .NET a installer.
            Telecharger le zip, extraire, executer ProcessManagerApp.exe.
          files: ProcessManagerApp-win-x64.zip
